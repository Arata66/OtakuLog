name: 代码与隔离演示检查

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java、前端与真实 MySQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: otakulog-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -potakulog-ci-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_USER: root
      DB_PASS: otakulog-ci-only
      OTAKULOG_MYSQL_SERVER: 127.0.0.1:3306
      OTAKULOG_MYSQL_TEST: 'true'
      OTAKULOG_DEMO_TEST: 'true'
      TZ: Asia/Shanghai
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: 配置 Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 配置 Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: 检查 MySQL 客户端
        run: mysql --version
      - name: 检查 JavaScript 语法与提交空白
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find src/main/resources/static scripts -type f \( -name '*.js' -o -name '*.cjs' \) -print0)
          git show --format= --check HEAD
          git diff --check
      - name: 干净构建与全部 Java 测试
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: 前端、演示工具与真实演示冒烟
        shell: bash
        run: |
          set -euo pipefail
          node --test src/test/js/*.test.cjs | tee node-tests.log
      - name: 保存测试报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 验证报告
          path: |
            target/surefire-reports/
            node-tests.log
            .demo/*.log
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true

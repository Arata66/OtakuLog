<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>正在打开 OtakuLog</title>
  <style>
    :root { color-scheme: light dark; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f5f7; color: #202630; }
    main { padding: 40px; max-width: 480px; }
    .name { font-size: 14px; font-weight: 650; letter-spacing: .08em; color: #56606e; }
    h1 { margin: 20px 0 12px; font-size: 27px; font-weight: 600; }
    p { line-height: 1.8; margin: 0; color: #657080; font-size: 14px; }
    .line { width: 52px; height: 3px; margin-top: 30px; background: #3454b4; }
    @media (prefers-color-scheme: dark) {
      body { background: #171b22; color: #edf0f5; }
      p, .name { color: #a6b0bf; }
    }
  </style>
</head>
<body><main>
  <div class="name">OtakuLog</div>
  <h1>正在打开你的资料库</h1>
  <p>正在检查本地数据并启动应用，完成后会自动进入。若需要升级资料，会先验证备份再迁移，请保持程序开启。</p>
  <div class="line" aria-hidden="true"></div>
</main></body>
</html>

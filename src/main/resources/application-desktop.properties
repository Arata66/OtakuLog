server.address=127.0.0.1
server.port=0
server.shutdown=graceful
# 壳在十五秒后由用户决定继续等待或强退，后端不能先行中断在途写入。
spring.lifecycle.timeout-per-shutdown-phase=24h
server.forward-headers-strategy=none

# 数据源只由桌面配置根据显式绝对资料目录创建，避免继承开发库连接。
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.sql.init.mode=never

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.jpa.open-in-view=false

# 桌面空库使用独立结构快照，不执行 MySQL 专用历史迁移。
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/desktop
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true

# 桌面默认关闭 AI，不引用开发环境的启用开关与密钥变量。
app.ai.enabled=false
app.ai.api-key=

spring.application.name=OtakuLog
server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/otaku_log?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration,classpath:com/otakulog
spring.flyway.out-of-order=true

# Security
app.admin.username=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASS:admin}

# AI 只在显式开启且提供仓库外凭据后可调用。
app.ai.enabled=${AI_ENABLE:false}
app.ai.api-key=${DEEPSEEK_API_KEY:}
app.ai.endpoint=${AI_ENDPOINT:https://api.deepseek.com/chat/completions}
app.ai.daily-limit=${AI_DAILY_LIMIT:20}
app.ai.connect-timeout-ms=${AI_CONNECT_TIMEOUT_MS:5000}
app.ai.response-timeout-ms=${AI_RESPONSE_TIMEOUT_MS:30000}
app.ai.input-price-per-million=${AI_INPUT_PRICE_PER_MILLION:2}
app.ai.output-price-per-million=${AI_OUTPUT_PRICE_PER_MILLION:8}
